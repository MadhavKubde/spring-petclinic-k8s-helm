kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.30.0
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
    listenAddress: "127.0.0.1"
  - containerPort: 30000
    hostPort: 3000
    listenAddress: "127.0.0.1"
  - containerPort: 30090
    hostPort: 9090
    listenAddress: "127.0.0.1"
